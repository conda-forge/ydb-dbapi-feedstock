schema_version: 1

context:
  name: ydb-dbapi
  version: "0.1.24"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ydb_dbapi-${{ version }}.tar.gz
  sha256: 2fdc6a736f023445ebdc466107666c68c52374d7d125e8ba787ff96255ef7991

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - python >=${{ python_min }},<4.0
    - ydb >=3.26.7,<4.0.0
tests:
  - python:
      imports:
        - ydb_dbapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: YDB Python DBAPI which complies with PEP 249
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ydb-platform/ydb-python-dbapi/
  repository: https://github.com/ydb-platform/ydb-python-dbapi/
  documentation: https://github.com/ydb-platform/ydb-python-dbapi/blob/main/README.md

extra:
  recipe-maintainers:
    - xylar
